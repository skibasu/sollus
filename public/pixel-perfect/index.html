<!doctype html>
<html lang="pl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sollus · Pixel Perfect</title>
<style>
  body { margin: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100dvh; background: #202020; color: white; font: 15px system-ui, sans-serif; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; }
  .preview { overflow: auto; }
  .viewport { position: relative; width: 1920px; height: 100%; overflow: hidden; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  img { position: absolute; top: 0; left: 0; opacity: .5; pointer-events: none; }
</style>
<div class="controls">
  <label for="opacity">Przezroczystość podkładu</label>
  <input id="opacity" type="range" min="0" max="100" value="50">
  <output id="value" for="opacity">50%</output>
  <span>1920 × 1080 px · przewijaj wewnątrz podglądu</span>
</div>
<div class="preview">
  <div class="viewport">
    <iframe id="site" title="Strona główna Sollus"></iframe>
    <img id="overlay" src="home-1920.png" width="1920" height="4048" alt="">
  </div>
</div>
<script>
  const opacity = document.getElementById("opacity");
  const value = document.getElementById("value");
  const overlay = document.getElementById("overlay");
  const site = document.getElementById("site");

  opacity.addEventListener("input", () => {
    overlay.style.opacity = opacity.valueAsNumber / 100;
    value.textContent = opacity.value + "%";
  });

  site.addEventListener("load", () => {
    const page = site.contentWindow;
    const comparisonStyle = page.document.createElement("style");
    comparisonStyle.textContent = `
      html { scrollbar-width: none; }
      body { min-height: ${overlay.height}px; }
      section:has(#hero-heading) { min-height: 1080px; }
    `;
    page.document.head.append(comparisonStyle);

    function alignOverlay() {
      overlay.style.transform = "translateY(" + -page.scrollY + "px)";
    }

    page.addEventListener("scroll", alignOverlay, { passive: true });
    alignOverlay();
  });
  site.src = "/";
</script>
</html>
